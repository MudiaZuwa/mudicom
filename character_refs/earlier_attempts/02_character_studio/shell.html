<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Studio</title>
<style>
  :root { --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1c1a; --muted:#6b6862; --line:#dcd8d0; --accent:#2f5772; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1a19; --panel:#262523; --ink:#ecebe8; --muted:#a19d96; --line:#3a3835; --accent:#8fb8d6; } }
  :root[data-theme="dark"] { --bg:#1b1a19; --panel:#262523; --ink:#ecebe8; --muted:#a19d96; --line:#3a3835; --accent:#8fb8d6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui, sans-serif; }
  .app { display:grid; grid-template-columns: 300px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); padding:14px; overflow:auto; max-height:100vh; background:var(--panel); }
  main { padding:16px; min-width:0; }
  h1 { font-size:16px; margin:0 0 10px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0; }
  label.f { display:grid; grid-template-columns: 90px 1fr 34px; gap:6px; align-items:center; margin:3px 0; color:var(--muted); }
  label.f output { font-variant-numeric: tabular-nums; color:var(--ink); }
  select, button, textarea, input[type=number] { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  .sel { display:grid; grid-template-columns: 90px 1fr; gap:6px; align-items:center; margin:3px 0; color:var(--muted); }
  .sw { display:grid; grid-template-columns: repeat(2, 1fr); gap:4px 8px; }
  .sw label { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:12px; }
  .sw input { width:24px; height:20px; padding:0; border:0; background:none; }
  textarea { width:100%; height:180px; font:11px/1.35 ui-monospace, monospace; }
  canvas { display:block; width:100%; height:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .checks { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } aside { max-height:none; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Character Studio</h1>
    <div class="row">
      <select id="preset"></select>
      <button class="primary" id="rand">Randomize</button>
    </div>
    <div class="row"><span style="color:var(--muted)">Seed</span><input type="number" id="seed" style="width:90px"><button id="go">Generate</button></div>
    <div class="checks row">
      <label><input type="checkbox" id="shading" checked> Cel shading</label>
      <label><input type="checkbox" id="guides"> Head guides</label>
    </div>
    <h2>Body</h2><div id="body"></div>
    <h2>Outfit</h2><div id="outfit"></div>
    <h2>Palette</h2><div id="palette" class="sw"></div>
    <h2>Character data (JSON)</h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="row"><button id="apply">Apply JSON</button><button id="png">Save PNG</button></div>
  </aside>
  <main><canvas id="stage" width="1500" height="1000"></canvas></main>
</div>
<script>
__ENGINE__
</script>
<script>
__PRESETS__
</script>
<script>
/* =====================================================================
   UI
   ===================================================================== */
const STAGE = { w: 1500, h: 1000, baseline: 965, unit: 118, centers: [260, 750, 1240] };
let spec = structuredClone(PRESETS['Korra study']);
const $ = id => document.getElementById(id);

function render() {
  const c = $('stage'), g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = getComputedStyle(c).backgroundColor || '#fff'; g.clearRect(0, 0, c.width, c.height);
  const H = spec.body.heads, u = STAGE.unit;
  ['front', 'side', 'back'].forEach((v, i) => {
    g.setTransform(u, 0, 0, u, STAGE.centers[i], STAGE.baseline - H * u);
    drawView(g, spec, v, { shading: $('shading').checked });
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#8a857c'; g.font = '600 13px system-ui'; g.textAlign = 'center'; g.fillText(v.toUpperCase(), STAGE.centers[i], 24);
  });
  if ($('guides').checked) {
    g.strokeStyle = 'rgba(40,110,200,.35)'; g.fillStyle = 'rgba(40,110,200,.85)'; g.font = '11px system-ui'; g.textAlign = 'left';
    for (let k = 0; k <= Math.ceil(H); k++) { const y = STAGE.baseline - (H - k) * u; g.beginPath(); g.moveTo(12, y); g.lineTo(STAGE.w - 12, y); g.stroke(); g.fillText(k + ' hd', 16, y - 3); }
  }
  $('json').value = JSON.stringify(spec, null, 1);
}

const BODY_FIELDS = [['heads', 6.2, 7.6], ['shoulders', 0.75, 1.2], ['chest', 0.55, 0.85], ['waist', 0.4, 0.7], ['hips', 0.55, 0.85], ['bust', 0, 1], ['muscle', 0, 1], ['armSpread', 0, 0.25], ['stance', 0, 0.3]];
function buildControls() {
  const body = $('body'); body.innerHTML = '';
  const sexRow = document.createElement('label'); sexRow.className = 'sel';
  sexRow.innerHTML = '<span>build</span>'; const sx = document.createElement('select'); sx.innerHTML = '<option value="1">feminine</option><option value="0">masculine</option>';
  sx.value = spec.body.female ? '1' : '0'; sx.onchange = () => { spec.body.female = sx.value === '1'; render(); }; sexRow.append(sx); body.append(sexRow);
  for (const [k, lo, hi] of BODY_FIELDS) {
    const l = document.createElement('label'); l.className = 'f';
    const inp = Object.assign(document.createElement('input'), { type: 'range', min: lo, max: hi, step: 0.01, value: spec.body[k] ?? 0 });
    const o = document.createElement('output'); o.textContent = (+inp.value).toFixed(2);
    inp.oninput = () => { spec.body[k] = +inp.value; o.textContent = (+inp.value).toFixed(2); render(); };
    l.append(Object.assign(document.createElement('span'), { textContent: k }), inp, o); body.append(l);
  }
  const outfit = $('outfit'); outfit.innerHTML = '';
  const sel = (label, options, get, set) => {
    const l = document.createElement('label'); l.className = 'sel'; const s = document.createElement('select');
    for (const o of options) s.add(new Option(o, o)); s.value = get(); s.onchange = () => { set(s.value); render(); };
    l.append(Object.assign(document.createElement('span'), { textContent: label }), s); outfit.append(l);
  };
  sel('hair', CATALOG.hair, () => spec.hair.style, v => spec.hair.style = v);
  sel('top', ['sleeveless', 'shirt', 'tunic', 'armor'], () => spec.top.type, v => { spec.top.type = v; if (v === 'tunic') spec.top.length = 'knee'; else if (spec.top.length === 'knee') spec.top.length = 'hip'; });
  sel('top length', ['crop', 'waist', 'hip', 'knee'], () => spec.top.length, v => spec.top.length = v);
  sel('collar', ['mandarin', 'high', 'none'], () => spec.top.collar, v => spec.top.collar = v);
  sel('closure', ['diagonal', 'frogs', 'center', 'none'], () => spec.top.closure, v => spec.top.closure = v);
  sel('sleeves', CATALOG.sleeves, () => spec.sleeves, v => spec.sleeves = v);
  sel('arms', ['none', 'gauntlets', 'gauntlets+armbands', 'armbands', 'bracers', 'gloves'], () => { const a = spec.arms || {}; return a.gauntlets && a.armbands ? 'gauntlets+armbands' : Object.keys(a).find(k => a[k]) || 'none'; },
    v => { spec.arms = {}; for (const k of v.split('+')) if (k !== 'none') spec.arms[k] = true; });
  sel('waist', CATALOG.waist, () => spec.waist.type, v => spec.waist.type = v);
  sel('skirt', ['pelt', 'tassets', 'none'], () => spec.skirt.type, v => spec.skirt.type = v);
  sel('pants', CATALOG.pants, () => spec.pants.type, v => spec.pants.type = v);
  sel('feet', CATALOG.feet, () => spec.feet.type, v => spec.feet.type = v);
  sel('scarf', ['no', 'yes'], () => spec.scarf ? 'yes' : 'no', v => spec.scarf = v === 'yes');
  sel('expression', CATALOG.expression, () => spec.face.expression || 'neutral', v => spec.face.expression = v);
  const pal = $('palette'); pal.innerHTML = '';
  for (const k of Object.keys(spec.palette)) {
    const l = document.createElement('label'); const i = Object.assign(document.createElement('input'), { type: 'color', value: spec.palette[k] });
    i.oninput = () => { spec.palette[k] = i.value; render(); }; l.append(i, k); pal.append(l);
  }
  $('seed').value = spec.seed;
}
function load(s) { spec = structuredClone(s); buildControls(); render(); }

for (const name of Object.keys(PRESETS)) $('preset').add(new Option(name, name));
$('preset').onchange = () => load(PRESETS[$('preset').value]);
$('rand').onclick = () => load(randomCharacter(Math.floor(Math.random() * 1e6)));
$('go').onclick = () => load(randomCharacter(+$('seed').value || 1));
$('shading').onchange = render; $('guides').onchange = render;
$('apply').onclick = () => { try { load(JSON.parse($('json').value)); } catch (e) { alert('JSON error: ' + e.message); } };
$('png').onclick = () => { const a = document.createElement('a'); a.download = 'character.png'; a.href = $('stage').toDataURL('image/png'); a.click(); };
const q = new URLSearchParams(location.search);
if (q.get('seed')) load(randomCharacter(+q.get('seed'))); else if (q.get('preset')) load(PRESETS[q.get('preset')]); else load(spec);
</script>
</body>
</html>
