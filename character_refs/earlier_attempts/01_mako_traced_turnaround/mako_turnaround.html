<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Turnaround</title>
<style>
  :root { --bg:#f4f2ee; --panel:#ffffff; --ink:#1d1c1a; --muted:#6b6862; --line:#dcd8d0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1a19; --panel:#262523; --ink:#ecebe8; --muted:#a19d96; --line:#3a3835; } }
  :root[data-theme="dark"] { --bg:#1b1a19; --panel:#262523; --ink:#ecebe8; --muted:#a19d96; --line:#3a3835; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, sans-serif; padding:16px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; max-width:1500px; margin:0 auto 12px; }
  h1 { font-size:18px; margin:0; }
  .controls { display:flex; flex-wrap:wrap; gap:14px; align-items:center; color:var(--muted); }
  .controls label { display:flex; gap:6px; align-items:center; cursor:pointer; }
  .swatches { display:flex; flex-wrap:wrap; gap:10px; max-width:1500px; margin:0 auto 12px; }
  .swatches label { display:flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); font-size:12px; color:var(--muted); }
  .swatches input { width:26px; height:22px; border:0; padding:0; background:none; cursor:pointer; }
  button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); cursor:pointer; }
  canvas { display:block; width:100%; max-width:1500px; height:auto; margin:0 auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
</style>
</head>

/* ============================================================
   RENDERER
   ============================================================ */
const STAGE = { width: 1500, height: 1000, baseline: 975, figureH: 920, centers: [250, 750, 1250] };

// Smooth closed/open Catmull-Rom path; points with a 3rd value of 1 are sharp corners.
function splinePath(ctx, pts, closed = true, t = 0.5) {
  const n = pts.length; if (n < 2) return;
  const P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  const tan = i => {
    const p = P(i);
    if (p[2] || (!closed && (i === 0 || i === n - 1))) return [0, 0];
    const a = P(i - 1), b = P(i + 1);
    return [(b[0] - a[0]) * t / 3 * 2 / 2, (b[1] - a[1]) * t / 3 * 2 / 2];
  };
  ctx.moveTo(pts[0][0], pts[0][1]);
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++) {
    const a = P(i), b = P(i + 1), ta = tan(i), tb = tan(i + 1);
    ctx.bezierCurveTo(a[0] + ta[0], a[1] + ta[1], b[0] - tb[0], b[1] - tb[1], b[0], b[1]);
  }
  if (closed) ctx.closePath();
}
function polyPath(ctx, pts) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}

function viewTransform(box, cx) {
  const s = STAGE.figureH / (box.bottom - box.top);
  return { s, tx: cx - box.cx * s, ty: STAGE.baseline - box.bottom * s };
}

function drawAuthored(ctx, view, pal) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const part of view.parts) {
    ctx.beginPath(); splinePath(ctx, part.pts, true);
    ctx.fillStyle = pal[part.fill]; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = view.line; ctx.stroke();
  }
  if (view.ink) {               // traced interior detail (face, folds, seams)
    ctx.beginPath();
    for (const p of view.ink) splinePath(ctx, p, true);
    ctx.fillStyle = INK; ctx.fill();
  }
  for (const l of view.lines || []) {
    ctx.beginPath(); splinePath(ctx, l.pts, false);
    ctx.strokeStyle = INK; ctx.lineWidth = l.w; ctx.stroke();
  }
}

function centroid(pts) { let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; } return [x / pts.length, y / pts.length]; }

function drawLabels(ctx, view, T) {
  ctx.save(); ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  for (const part of view.parts) {
    const pts = part.pts;
    const [x, y] = centroid(pts);
    const X = x * T.s + T.tx, Y = y * T.s + T.ty;
    const w = ctx.measureText(part.name).width + 6;
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(X - w / 2, Y - 8, w, 14);
    ctx.fillStyle = '#b3261e'; ctx.fillText(part.name, X, Y + 3);
  }
  ctx.restore();
}

function drawGuides(ctx) {
  const head = STAGE.figureH / 6.6; // head units measured from the front view
  ctx.save(); ctx.strokeStyle = 'rgba(40,110,200,.35)'; ctx.fillStyle = 'rgba(40,110,200,.8)'; ctx.font = '11px system-ui';
  for (let i = 0; i <= 7; i++) {
    const y = STAGE.baseline - STAGE.figureH + i * head;
    if (y > STAGE.baseline + 1) break;
    ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(STAGE.width - 20, y); ctx.stroke();
    ctx.fillText(i + ' hd', 24, y - 3);
  }
  ctx.restore();
}

const refs = {};
function render(opts = {}) {
  const c = document.getElementById('stage'), ctx = c.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, c.width, c.height);
  const views = [[FRONT, drawAuthored, 'FRONT'], [SIDE, drawAuthored, 'SIDE'], [BACK, drawAuthored, 'BACK']];
  views.forEach(([view, fn, title], i) => {
    const T = viewTransform(view.box, STAGE.centers[i]);
    ctx.setTransform(T.s, 0, 0, T.s, T.tx, T.ty);
    const ref = refs[title];
    if (ref && opts.refUnder) { ctx.globalAlpha = 1; ctx.drawImage(ref.img, ref.x, ref.y, ref.w, ref.h); }
    ctx.globalAlpha = opts.alpha ?? 1;
    fn(ctx, view, PALETTE);
    ctx.globalAlpha = 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#8a857c'; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(title, STAGE.centers[i], 26);
    if (opts.labels) drawLabels(ctx, view, T);
  });
  if (opts.guides) drawGuides(ctx);
}

  const l = document.createElement('label');
  const i = document.createElement('input'); i.type = 'color'; i.value = PALETTE[key];
  i.addEventListener('input', () => { PALETTE[key] = i.value; render(ui()); });
  l.append(i, key); sw.append(l);
}

  render({ ...ui(), labels: false });
  const a = document.createElement('a'); a.download = 'character-turnaround.png';
  a.href = document.getElementById('stage').toDataURL('image/png'); a.click(); render(ui());
});

document.querySelectorAll('.controls input').forEach(el => el.addEventListener('change', () => render(ui())));
render(ui());
